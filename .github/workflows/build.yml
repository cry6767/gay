name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip schoolboykeys-addon.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - run: gradle build
        working-directory: schoolboykeys
      - uses: actions/upload-artifact@v4
        with:
          name: schoolboykeys-jar
          path: schoolboykeys/build/libs/*.jar
